# Included into the server block and into every location that adds a header of
# its own. nginx's `add_header` does not inherit into a location that declares
# any `add_header`, so anything less than repeating them here would silently drop
# the Content-Security-Policy on exactly the paths that carry the voice models.

# --- The privacy guarantee, enforced by the browser ---------------------------
#
# `connect-src 'self'` means a fetch, XHR or WebSocket to any other origin is
# blocked before it is sent. With `default-src 'self'` and `form-action 'none'`,
# there is no route by which document text can leave this machine — not through
# a bug in the app, and not through markup smuggled into a dropped file.
#
# `'wasm-unsafe-eval'` is what allows WebAssembly to be instantiated, and so what
# lets the neural voice run locally. It does not permit eval() of JavaScript.
#
# `blob:` has to appear in `script-src`, not only in `worker-src`. ONNX Runtime
# spawns its threading workers from Blob URLs; Chrome governs that with
# `worker-src`, but Firefox checks the worker's script load against
# `script-src-elem`, which falls back to `script-src`. With `blob:` in
# `worker-src` alone, Firefox blocks every inference worker and synthesis fails
# with a NetworkError. A blob: URL can only be minted by same-origin script, so
# this opens no path to a remote origin — `connect-src 'self'` still holds.
#
# Firefox additionally reports a `script-src` eval violation from
# onnxruntime-web. It comes from protobufjs's `inquire()`, which probes for
# CommonJS via `eval` inside a `try`/`catch` and is *expected* to fail in a
# browser. It is reported noise, not a fault, and `'unsafe-eval'` is
# deliberately not granted.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# Cross-origin isolation enables SharedArrayBuffer, which ONNX Runtime needs for
# multi-threaded inference. Without it synthesis still works, but single-threaded
# and noticeably slower.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
