<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Reads .docx, .md and .html documents aloud in the browser, fully offline." />
    <title>Papierlaut</title>
  </head>
  <body>
    <a class="skip-link" href="#document">Skip to document</a>

    <header class="app-bar">
      <div class="app-bar__identity">
        <h1 class="app-bar__name" data-i18n="app.name">Papierlaut</h1>
        <p class="app-bar__tagline" data-i18n="app.tagline"></p>
      </div>

      <div class="app-bar__actions">
        <span class="badge" data-i18n-title="privacy.detail" tabindex="0">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="14" height="14">
            <path
              fill="currentColor"
              d="M12 1.6 4 5v6.2c0 5 3.4 9.6 8 11.2 4.6-1.6 8-6.2 8-11.2V5l-8-3.4Zm0 2.2 6 2.5v4.9c0 4-2.6 7.8-6 9.2-3.4-1.4-6-5.2-6-9.2V6.3l6-2.5Z"
            />
          </svg>
          <span data-i18n="privacy.badge"></span>
        </span>

        <label class="field field--compact">
          <span class="field__label" data-i18n="toolbar.uiLanguage"></span>
          <select id="ui-language" class="control">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>

        <button id="close-document" class="button button--ghost" type="button" hidden data-i18n="toolbar.close"></button>
      </div>
    </header>

    <main class="app-main">
      <section id="dropzone" class="dropzone" aria-labelledby="dropzone-headline">
        <div class="dropzone__inner">
          <svg class="dropzone__icon" viewBox="0 0 24 24" aria-hidden="true" width="44" height="44">
            <path
              fill="currentColor"
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm0 2.5L17.5 8H14V4.5ZM8 13h8v2H8v-2Zm0 4h8v2H8v-2Z"
            />
          </svg>
          <h2 id="dropzone-headline" class="dropzone__headline" data-i18n="drop.headline"></h2>
          <p class="dropzone__hint" data-i18n="drop.hint"></p>
          <button id="choose-file" class="button button--primary" type="button" data-i18n="drop.button"></button>
          <p class="dropzone__formats" data-i18n="drop.formats"></p>
          <input id="file-input" class="visually-hidden" type="file" />
          <p class="dropzone__release" data-i18n="drop.release"></p>
        </div>

        <ul class="shortcuts">
          <li class="shortcuts__title" data-i18n="shortcuts.title"></li>
          <li data-i18n="shortcuts.playPause"></li>
          <li data-i18n="shortcuts.skip"></li>
          <li data-i18n="shortcuts.speed"></li>
          <li data-i18n="shortcuts.click"></li>
        </ul>
      </section>

      <section id="reader" class="reader" hidden>
        <div class="toolbar" role="toolbar" aria-label="Playback">
          <div class="toolbar__transport">
            <button id="previous" class="button button--icon" type="button" data-i18n-label="toolbar.previous" data-i18n-title="toolbar.previous">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
                <path fill="currentColor" d="M7 6h2v12H7V6Zm10 0v12l-8-6 8-6Z" />
              </svg>
            </button>

            <button id="play" class="button button--play" type="button" data-i18n-label="toolbar.play" data-i18n-title="toolbar.play">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" width="22" height="22">
                <path fill="currentColor" d="M8 5.5v13l11-6.5L8 5.5Z" />
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" width="22" height="22" hidden>
                <path fill="currentColor" d="M7 5h3.5v14H7V5Zm6.5 0H17v14h-3.5V5Z" />
              </svg>
            </button>

            <button id="next" class="button button--icon" type="button" data-i18n-label="toolbar.next" data-i18n-title="toolbar.next">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
                <path fill="currentColor" d="M15 6h2v12h-2V6ZM7 6l8 6-8 6V6Z" />
              </svg>
            </button>

            <button id="stop" class="button button--icon" type="button" data-i18n-label="toolbar.stop" data-i18n-title="toolbar.stop">
              <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
                <path fill="currentColor" d="M6 6h12v12H6V6Z" />
              </svg>
            </button>
          </div>

          <label class="field">
            <span class="field__label" data-i18n="toolbar.voice"></span>
            <select id="voice" class="control control--wide"></select>
          </label>

          <label class="field">
            <span class="field__label">
              <span data-i18n="toolbar.speed"></span>
              <output id="rate-value" class="field__value">1.0×</output>
            </span>
            <input id="rate" class="slider" type="range" min="0.5" max="2" step="0.05" value="1" />
          </label>

          <label class="field field--compact">
            <span class="field__label" data-i18n="toolbar.volume"></span>
            <input id="volume" class="slider" type="range" min="0" max="1" step="0.05" value="1" />
          </label>

          <label class="switch">
            <input id="follow" type="checkbox" checked />
            <span data-i18n="toolbar.follow"></span>
          </label>
        </div>

        <div class="statusbar">
          <span id="status" class="statusbar__state"></span>
          <span id="position" class="statusbar__position"></span>
          <div class="progress" role="presentation"><div id="progress" class="progress__bar"></div></div>
        </div>

        <article id="document" class="document" tabindex="-1" lang="en"></article>
      </section>
    </main>

    <div id="toast" class="toast" role="alert" hidden>
      <span id="toast-message" class="toast__message"></span>
      <button id="toast-dismiss" class="button button--ghost button--small" type="button" data-i18n="error.dismiss"></button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
