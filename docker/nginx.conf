server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # `application/wasm` is part of nginx's bundled mime.types; a `types` block
    # here would replace the whole map rather than extend it.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # .onnx weights and .wasm binaries are already compact — re-compressing them
    # costs CPU on every request and saves almost nothing.

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted by the bundler, so they can be cached indefinitely.
    # `expires` is deliberately not used alongside these: it emits a
    # Cache-Control of its own, and the response would carry two of them.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Voice models and the WebAssembly runtime are large and versioned by name.
    # Caching them is what makes every visit after the first one instant.
    location /tts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # The manifest decides which voices the UI offers, so it must not go stale
    # after the image is rebuilt with a different voice selection.
    location = /tts/voices/manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
